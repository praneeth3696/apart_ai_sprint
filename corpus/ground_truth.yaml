# ground_truth.yaml
#
# Single source of truth for corpus generation. build_corpus.py must read
# this file, never hardcode any of these numbers. CITATIONS.md is the
# human-readable rendering of the `source` fields below.
#
# verified: true  -> cross-checked against the HF blog table on 2026-09-04
#                     via two independent fetches (github raw md + live page),
#                     both agreed exactly. Safe to assert on and cite.
# verified: false -> pulled once, by a small extraction model summarizing the
#                     page, prose-derived rather than table-derived. Re-read
#                     the source paragraph yourself before this goes into
#                     CITATIONS.md or PREREGISTRATION.md.

source_document:
  title: "Anatomy of a Frontier Lab Agent Intrusion: A Technical Timeline of the July 2026 Incident"
  publisher: "Hugging Face"
  date: "2026-07-27"
  url: "https://huggingface.co/blog/agent-intrusion-technical-timeline"
  verified: true

campaign_window:
  start_utc: "2026-07-09T02:28:00Z"
  end_utc: "2026-07-13T14:14:00Z"
