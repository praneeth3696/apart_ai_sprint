  - name: admin_host_level_access_multi_cluster
    telemetry: "kubectl auth can-i '*' '*' --all-namespaces -> yes [cluster-a]; yes [cluster-b]"
    phase: k8s
    order: 8
    t_utc: null
    not_after: "2026-07-12T05:07:00Z"  # 16:07 Jul 11 (jinja2_ssti_rce) + 13h, from "under 13 hours" - a REAL constraint the generator must respect, not just a comment
    note: >
      "In under 13 hours, the agents progressed from executing code in a
