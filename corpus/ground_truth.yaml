      (OpenAI report, narrative). No exact timestamp in either source;
      the Key Technical Events table has no row between 07-11 21:06 and
      07-12 06:29, so this event falls in that gap. Do NOT confuse with
      the July 19 privileged-pod event in OpenAI's report section V -
      that one is against OpenAI's OWN infrastructure and explicitly
      unrelated (see source_document_2.scope_boundary).
    mitre_technique: T1611
    mitre_tactic: Privilege Escalation
    mitre_confidence: inferred
