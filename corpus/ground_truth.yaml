  verified: true

total_actions:
  # NOTE: two different published tables in the same source give two
  # different totals - see `phase_total_reconciliation` below. The
  # daily-volume table (17,613) is the one to treat as authoritative:
  # it agrees with the source's own rounded headline to within 13
  # actions (0.07%), i.e. within "~" rounding noise. The phase table
  # (16,521) is therefore incomplete, not the daily table wrong.
  published_headline: 17600
  daily_volume_table_sum: 17613
  source: "\"our forensic reconstruction covers ~17,600 attacker actions\", grouped into \"~6,280 clusters\""
  verified: true

phase_total_reconciliation:
  sum_of_phase_table: 16521
  sum_of_daily_volume_table: 17613
  gap: 1092
  gap_pct_of_daily_total: 6.20
  finding: >
    PLAN.md requires asserting BOTH "phase totals match published counts"
    AND "daily volumes match published counts". These two published tables
    do not sum to the same total (16,521 vs 17,613) - a phase x day matrix
    over only the 9 named phases satisfying both exactly is mathematically
    infeasible, short by 1,092 actions. The daily-volume total sits within
    13 actions of the source's own "~17,600" headline (0.07%), so it is the
    more authoritative total; the phase table under-covers actual daily
    volume by ~6.2%.
  resolution: >
    Add a 10th allocation row, `unclassified`, actions=1092, eligible all
    5 days, NOT part of the 9 named kill-chain phases, gt_malicious=false
    by default (unattributed background/tooling noise the phase table
    doesn't itemize). This is an inference forced by the source's own
    arithmetic, not a narrative convenience - state it exactly this way
    in CITATIONS.md. The 9 phase totals (16,521) remain asserted exactly
    as published; only the daily-volume assertion needs the 10th row to
    be satisfiable at all.

